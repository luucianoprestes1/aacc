<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AACC — Meus Certificados</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" href="assets/image/logo-cps-2022.svg" type="image/svg+xml">
</head>
<body>
    <header class="cabecalho">
        <img class="cabecalho-imagem" src="assets/image/fateccb.png" alt="Logo Fatec Capão Bonito">
        <img class="cabecalho-imagem" src="assets/image/cps.png" alt="Logo CPS">
    </header>

    <h1>AACC</h1>
    <p id="ra-label"></p>

    <div class="lista" id="lista">
        <p>Carregando...</p>
    </div>
    <p id="vazio">Nenhum certificado enviado ainda.</p>

    <button onclick="window.location.href='form.html'">← Enviar novo</button>

    <div id="modal">
        <div id="modal-inner">
            <img id="modal-img" src="" alt="Certificado">
            <iframe id="modal-pdf" src=""></iframe>
            <button id="modal-close" onclick="fecharModal()">Fechar</button>
        </div>
    </div>

    <script type="module" src="assets/js/list.js"></script>
</body>
</html>
